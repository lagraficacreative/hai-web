<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="c-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#7C6AF7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="c-inner" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0D3A63" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-top" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B7E7FF"/>
      <stop offset="80%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-figure" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F7FAFF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="#0D3A63"/>

  <!-- Halo ambiental de la sala -->
  <ellipse cx="400" cy="470" rx="200" ry="18" fill="#000" opacity="0.4"/>

  <!-- Cilindro de cristal — cuerpo -->
  <path d="M320,70 L320,440 A80,18 0 0 0 480,440 L480,70 A80,18 0 0 0 320,70 Z"
        fill="url(#c-glass)"/>

  <!-- Halo interior (proyección) -->
  <ellipse cx="400" cy="255" rx="76" ry="170" fill="url(#c-inner)"/>

  <!-- Figura holográfica silueteada dentro (persona de pie) -->
  <g transform="translate(400,200)">
    <ellipse cx="0" cy="70" rx="60" ry="130" fill="url(#c-figure)"/>
    <g fill="#F7FAFF" opacity="0.92">
      <!-- cabeza -->
      <circle cx="0" cy="-30" r="18"/>
      <!-- torso -->
      <path d="M-22,-10 Q-26,20 -22,60 L-20,90 L20,90 L22,60 Q26,20 22,-10 Q10,-16 0,-16 Q-10,-16 -22,-10 Z"/>
      <!-- brazos -->
      <path d="M-22,-5 L-32,45" stroke="#F7FAFF" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M22,-5 L32,45" stroke="#F7FAFF" stroke-width="10" stroke-linecap="round" fill="none"/>
      <!-- piernas -->
      <line x1="-11" y1="90" x2="-14" y2="180" stroke="#F7FAFF" stroke-width="15" stroke-linecap="round"/>
      <line x1="11" y1="90" x2="14" y2="180" stroke="#F7FAFF" stroke-width="15" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Reflejos verticales del cristal -->
  <line x1="335" y1="80" x2="335" y2="435" stroke="#B7E7FF" stroke-width="1" opacity="0.35"/>
  <line x1="465" y1="80" x2="465" y2="435" stroke="#B7E7FF" stroke-width="1" opacity="0.35"/>
  <line x1="360" y1="80" x2="360" y2="435" stroke="#F7FAFF" stroke-width="0.5" opacity="0.15"/>

  <!-- Aros del cristal (arriba y abajo) -->
  <ellipse cx="400" cy="440" rx="80" ry="18" fill="#0A2438"/>
  <ellipse cx="400" cy="440" rx="80" ry="18" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.6"/>
  <ellipse cx="400" cy="70" rx="80" ry="16" fill="#1E6ED8"/>
  <ellipse cx="400" cy="70" rx="80" ry="16" fill="none" stroke="#22D3EE" stroke-width="1.3" opacity="0.75"/>

  <!-- Luz superior (proyector) -->
  <ellipse cx="400" cy="68" rx="60" ry="10" fill="url(#c-top)"/>

  <!-- Base sólida -->
  <rect x="310" y="448" width="180" height="16" rx="4" fill="#0A2438"/>
  <ellipse cx="400" cy="466" rx="150" ry="10" fill="#000" opacity="0.5"/>

  <!-- Partículas -->
  <g fill="#B7E7FF">
    <circle cx="200" cy="180" r="1.3" opacity="0.55"/>
    <circle cx="620" cy="220" r="1.4" opacity="0.6"/>
    <circle cx="150" cy="330" r="1.2" opacity="0.5"/>
    <circle cx="650" cy="120" r="1" opacity="0.45"/>
  </g>
</svg>
