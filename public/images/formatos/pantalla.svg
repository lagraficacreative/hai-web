<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="p-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#7C6AF7" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="p-reflect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#F7FAFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#F7FAFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="p-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B9DFF"/>
      <stop offset="1" stop-color="#0A2438"/>
    </linearGradient>
    <radialGradient id="p-product" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="70%" stop-color="#7C6AF7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C6AF7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="#0D3A63"/>

  <!-- «Escaparate» detrás del cristal: producto visible A TRAVÉS de la pantalla -->
  <g opacity="0.85">
    <!-- suelo/pared del escaparate -->
    <rect y="380" width="800" height="120" fill="#0A2438"/>
    <line x1="0" y1="380" x2="800" y2="380" stroke="#22D3EE" stroke-width="0.8" opacity="0.35"/>
    <!-- producto (algo abstracto: forma orgánica con brillo) -->
    <ellipse cx="500" cy="270" rx="90" ry="120" fill="url(#p-product)"/>
    <path d="M485,180 Q460,250 475,340 Q505,360 525,340 Q540,240 515,180 Q500,175 485,180 Z"
          fill="#7C6AF7" opacity="0.55"/>
    <ellipse cx="490" cy="220" rx="18" ry="26" fill="#F7FAFF" opacity="0.3"/>
  </g>

  <!-- Panel OLED transparente (marco fino, contenido superpuesto) -->
  <g>
    <!-- marco -->
    <rect x="150" y="70" width="500" height="360" rx="10" fill="none"
          stroke="url(#p-frame)" stroke-width="4"/>
    <!-- cristal -->
    <rect x="152" y="72" width="496" height="356" rx="9" fill="url(#p-glass)"/>
    <!-- reflejo diagonal del cristal -->
    <rect x="152" y="72" width="496" height="356" rx="9" fill="url(#p-reflect)"/>

    <!-- Contenido superpuesto de la pantalla — HAI + gráfico de datos abstracto -->
    <g opacity="0.92">
      <text x="200" y="140" font-family="Manrope,system-ui,sans-serif"
            font-size="46" font-weight="700" fill="#F7FAFF">HAI</text>
      <text x="200" y="162" font-family="Manrope,system-ui,sans-serif"
            font-size="11" letter-spacing="3" fill="#22D3EE" opacity="0.85">HUMAN AI EXPERIENCES</text>
      <line x1="200" y1="180" x2="380" y2="180" stroke="#22D3EE" stroke-width="1.2" opacity="0.6"/>

      <!-- gráfico de líneas (datos que muestra la pantalla) -->
      <polyline points="200,320 235,290 270,300 305,255 340,270 375,220"
                fill="none" stroke="#22D3EE" stroke-width="2"/>
      <polyline points="200,360 235,340 270,345 305,310 340,320 375,280"
                fill="none" stroke="#7C6AF7" stroke-width="2" opacity="0.75"/>
      <!-- puntos de datos -->
      <g fill="#B7E7FF">
        <circle cx="200" cy="320" r="3"/>
        <circle cx="270" cy="300" r="3"/>
        <circle cx="340" cy="270" r="3"/>
        <circle cx="375" cy="220" r="4"/>
      </g>

      <!-- indicadores UI -->
      <rect x="200" y="385" width="60" height="4" rx="2" fill="#22D3EE" opacity="0.7"/>
      <rect x="270" y="385" width="40" height="4" rx="2" fill="#7C6AF7" opacity="0.6"/>
      <rect x="320" y="385" width="20" height="4" rx="2" fill="#22D3EE" opacity="0.4"/>
    </g>

    <!-- Etiqueta "TRANSPARENT OLED" muy sutil arriba a la derecha -->
    <text x="628" y="93" font-family="Manrope,system-ui,sans-serif" font-size="9"
          letter-spacing="1.5" text-anchor="end" fill="#22D3EE" opacity="0.55">TRANSPARENT OLED</text>
  </g>

  <!-- Base/soporte de la pantalla -->
  <rect x="330" y="430" width="140" height="14" fill="#0A2438"/>
  <rect x="320" y="444" width="160" height="8" rx="4" fill="#1E6ED8"/>
</svg>
